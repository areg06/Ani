<!doctype html>
<html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Փոքր արբանյակներ · Միջանկյալ 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400;500;600;700&family=Noto+Serif+Armenian:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: mission-notebook study app (adapted from the Նյութագիտություն platform). Left rail of sections, one working column; figures sit on printed "plates". */
:root{
  --bg:#EDF0F0; --surface:#FAFBFB; --sunk:#E3E8E9; --ink:#162027; --muted:#56636C; --line:#CDD5D8;
  --accent:#2A4C9C; --accent-ink:#FFFFFF; --accent-soft:#DCE4F5; --heat:#B4530F; --heat-soft:#F6E2D2;
  --good:#2C7A4B; --good-soft:#D9EEDF; --warn:#A86A12; --warn-soft:#F5E8CF; --bad:#B0302A; --bad-soft:#F6DAD8;
  --plate:#F8F8F5; --plate-ink:#1E1E1E;
  --f-display:"Noto Serif Armenian","Mshtakan",Georgia,serif;
  --f-body:"Noto Sans Armenian","Arial","Helvetica Neue",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161A; --surface:#182026; --sunk:#0D1215; --ink:#E3E8EB; --muted:#93A1AA; --line:#2A353C;
  --accent:#8FA9F2; --accent-ink:#0E1630; --accent-soft:#1F2A46; --heat:#F0A060; --heat-soft:#3A2618;
  --good:#6CC98F; --good-soft:#18301F; --warn:#E3B45B; --warn-soft:#352914; --bad:#F08A82; --bad-soft:#3A1A18;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11161A; --surface:#182026; --sunk:#0D1215; --ink:#E3E8EB; --muted:#93A1AA; --line:#2A353C;
  --accent:#8FA9F2; --accent-ink:#0E1630; --accent-soft:#1F2A46; --heat:#F0A060; --heat-soft:#3A2618;
  --good:#6CC98F; --good-soft:#18301F; --warn:#E3B45B; --warn-soft:#352914; --bad:#F08A82; --bad-soft:#3A1A18;
  color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;margin:0}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.25;text-wrap:balance;margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;padding:24px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:20px;overflow:auto}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.brand b{font-family:var(--f-display);font-size:20px;letter-spacing:.01em}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:500;font-size:15px}
.nav a:hover{background:var(--sunk)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav .ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6}
.rail-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 8px;display:flex;flex-direction:column;gap:8px}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:12px;text-align:left}

main{padding-block:32px 64px;padding-inline:40px;min-width:0}
.view{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.view-head{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.view-head h1{font-size:30px;font-weight:700}
.lede{color:var(--muted);max-width:62ch}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:8px;font-weight:600;font-size:15px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:5px 11px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
select,input[type="text"],input[type="search"],textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{width:100%;min-height:150px;resize:vertical;line-height:1.55}

/* Home */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-mono);font-size:26px;font-weight:500}
.stat span{font-size:13px;color:var(--muted)}
.topics{display:flex;flex-direction:column}
.topic{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.topic:last-child{border-bottom:0}
.topic h3{font-size:16px;font-family:var(--f-body);font-weight:600}
.topic p{font-size:13px;color:var(--muted);margin:2px 0 0}
.segbar{display:flex;gap:3px}
.segbar i{flex:1;height:10px;border-radius:3px;background:var(--sunk);border:1px solid var(--line)}
.segbar i.r1{background:var(--bad);border-color:var(--bad)}
.segbar i.r2{background:var(--warn);border-color:var(--warn)}
.segbar i.r3{background:var(--good);border-color:var(--good)}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;counter-reset:s}
.step{border-top:3px solid var(--accent);padding-top:10px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.step b{font-size:15px}
.step a{font-size:13px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* Lectures */
.lec-tabs{display:flex;gap:6px;flex-wrap:wrap}
.lec-tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:14px;display:flex;gap:6px;align-items:center}
.lec-tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lec-tabs .dot{width:7px;height:7px;border-radius:50%;background:var(--good)}
.reader{display:flex;flex-direction:column;gap:30px}
.reader-head{display:flex;flex-direction:column;gap:8px;padding-bottom:18px;border-bottom:2px solid var(--ink)}
.reader-head h2{font-size:28px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);letter-spacing:.02em}
.toc{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px}
.sec{display:flex;flex-direction:column;gap:12px;scroll-margin-top:20px}
.sec h3{font-size:21px;display:flex;gap:10px;align-items:baseline}
.sec h3 .n{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-weight:400}
.sec h4{font-size:17px;margin-top:6px}
.prose{max-width:68ch}
.prose p,.prose ul,.prose ol,.prose dl{margin:0 0 10px}
.prose ul,.prose ol{padding-left:22px}
.prose li{margin:3px 0}
.prose dt{font-weight:700;margin-top:12px;font-family:var(--f-display);font-size:16.5px}
.prose dd{margin:2px 0 0 0;padding-left:14px;border-left:2px solid var(--line)}
.key{background:var(--accent-soft);border-radius:8px;padding:12px 14px;margin:6px 0 10px}
.formula{font-family:var(--f-mono);background:var(--sunk);border-radius:6px;padding:8px 12px;margin:8px 0;font-size:14.5px;overflow-x:auto}
.formula.big{font-size:20px;text-align:center;padding:14px}
.sup{color:inherit}
.sup-on .sup{background:linear-gradient(transparent 0, transparent),var(--heat-soft);box-decoration-break:clone;-webkit-box-decoration-break:clone;border-radius:3px;padding:0 2px}
div.sup,p.sup{display:block}
.sup-on div.sup,.sup-on p.sup{padding:8px 12px;border-left:3px solid var(--heat)}
.note{font-size:13.5px;color:var(--muted);font-style:italic}
.tbl-wrap{overflow-x:auto;max-width:100%}
.tbl{border-collapse:collapse;font-size:14px;width:100%;margin:6px 0 12px}
.tbl th{text-align:left;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;border-bottom:2px solid var(--ink);padding:6px 10px 6px 0}
.tbl td{border-bottom:1px solid var(--line);padding:8px 10px 8px 0;vertical-align:top}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 12px}
.cmp>div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.cmp h5{margin:0 0 6px;font-family:var(--f-display);font-size:16px}
.cmp p,.cmp ul{margin:0}
.figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
figure{margin:0;display:flex;flex-direction:column;gap:6px}
.plate{background:var(--plate);border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;align-items:center;justify-content:center;cursor:zoom-in}
.plate img{max-height:240px;width:auto;mix-blend-mode:multiply}
figcaption{font-size:13px;color:var(--muted);line-height:1.45}
figcaption b{font-family:var(--f-mono);font-weight:500;color:var(--ink)}
.reader-foot{display:flex;gap:10px;flex-wrap:wrap;padding-top:18px;border-top:1px solid var(--line)}
.lb{position:fixed;inset:0;background:rgba(10,14,16,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;z-index:50}
.lb img{max-width:min(1100px,100%);max-height:80vh;background:#F8F8F5;padding:12px;border-radius:6px}
.lb p{color:#E8ECEE;max-width:70ch;text-align:center;margin:0}
.search-hits{display:flex;flex-direction:column;gap:6px}
.hit{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;text-align:left;font-size:14px}
.hit b{display:block;font-size:13px;color:var(--muted);font-weight:600}
mark{background:var(--heat-soft);color:inherit;border-radius:2px}

/* Questions */
.qgroup{display:flex;flex-direction:column;gap:10px}
.qgroup>h2{font-size:19px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.q-head{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:start;padding:14px 16px;width:100%;background:none;border:0;text-align:left}
.q-id{font-family:var(--f-mono);font-size:14px;color:var(--muted);padding-top:1px}
.q-text{font-weight:600;font-size:15.5px}
.badge{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.badge.r0{background:var(--sunk);color:var(--muted)}
.badge.r1{background:var(--bad-soft);color:var(--bad)}
.badge.r2{background:var(--warn-soft);color:var(--warn)}
.badge.r3{background:var(--good-soft);color:var(--good)}
.q-body{padding:0 16px 16px 80px;display:flex;flex-direction:column;gap:12px}
.recall{border:1px dashed var(--line);border-radius:8px;padding:12px 14px;color:var(--muted);font-size:14px}
.answer{border-left:3px solid var(--accent);padding-left:14px}
.rate{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px}
.rate button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:14px;font-weight:600}
.rate button[data-r="1"][aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.rate button[data-r="2"][aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.rate button[data-r="3"][aria-pressed="true"]{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Study / check modes */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--sunk);padding:5px;border-radius:12px}
.modes button{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;border:0;background:none;border-radius:8px;padding:10px 14px}
.modes button span{font-size:13px;color:var(--muted)}
.modes button[aria-selected="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.modes button[aria-selected="true"] b{color:var(--accent)}

/* Writing practice */
.tip ol{margin:6px 0 0;padding-left:20px;font-size:14.5px}
.checklist{display:flex;flex-direction:column;gap:6px;background:var(--sunk);border-radius:8px;padding:12px 14px}
.cl-item{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;align-items:start;font-size:14.5px;cursor:pointer}
.cl-item input{margin-top:5px;accent-color:var(--good)}
.cl-item:has(input:checked) span{color:var(--muted)}
details.full{border:1px solid var(--line);border-radius:8px}
details.full>summary{cursor:pointer;padding:10px 14px;font-weight:600;color:var(--accent)}
.full-in{padding:4px 14px 16px;display:flex;flex-direction:column;gap:18px}
.full-in .sec h3{font-size:18px}

/* Flashcards */
.deck{display:flex;flex-direction:column;align-items:center;gap:16px}
.card{width:100%;max-width:620px;min-height:260px;perspective:1400px;background:none;border:0;padding:0}
.card-in{position:relative;width:100%;min-height:260px;transition:transform .45s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.card.flipped .card-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:28px;text-align:center}
.face.back{transform:rotateY(180deg);background:var(--accent-soft)}
.face .term{font-family:var(--f-display);font-size:26px;font-weight:700}
.face .def{font-size:18px;max-width:46ch}
.face small{position:absolute;top:14px;left:18px;font-size:12px;color:var(--muted);letter-spacing:.05em}
.face .hint{position:absolute;bottom:12px;font-size:12px;color:var(--muted)}
.deck-ctrl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.progress{width:100%;max-width:620px;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}

/* Quiz */
.qz-opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 14px;font-size:15.5px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font-family:var(--f-mono);color:var(--muted)}
.opt.ok{background:var(--good-soft);border-color:var(--good)}
.opt.no{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.explain{font-size:14.5px;padding:10px 14px;border-radius:8px;background:var(--sunk)}
.qz-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.qz-q{font-size:20px;font-family:var(--f-display);font-weight:600}
.score{font-family:var(--f-mono);font-size:56px;line-height:1}
.mist{display:flex;flex-direction:column;gap:10px}
.mist>div{border-left:3px solid var(--bad);padding-left:12px;font-size:14.5px}
.hist{display:flex;gap:6px;align-items:flex-end;height:60px}
.hist i{width:22px;background:var(--accent);border-radius:3px 3px 0 0;opacity:.85}

/* Exam */
.timer{font-family:var(--f-mono);font-size:22px}
.timer.low{color:var(--bad)}
.ticket{display:flex;flex-direction:column;gap:10px;padding:18px 0;border-bottom:1px solid var(--line)}
.ticket h3{font-family:var(--f-body);font-size:16.5px;font-weight:600}
.ticket .q-id{font-size:13px}

/* Diagram */
.dg-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.dg{display:block;width:100%;min-width:620px;height:auto;cursor:crosshair;touch-action:manipulation}
.dg .reg{fill:transparent;stroke:none}
.dg .reg:hover{fill:var(--accent-soft)}
.dg .reg.on{fill:var(--heat-soft)}
.dg .ln{stroke:var(--ink);stroke-width:1.8;fill:none}
.dg .ln.thin{stroke-width:1;stroke-dasharray:4 4;stroke:var(--muted)}
.dg .grid{stroke:var(--line);stroke-width:1}
.dg text{fill:var(--ink);font-family:var(--f-body);font-size:13px}
.dg .axis{fill:var(--muted);font-family:var(--f-mono);font-size:11.5px}
.dg .pt{fill:var(--accent);font-family:var(--f-mono);font-size:12px;font-weight:500}
.dg .lbl{fill:var(--muted);font-size:13px;pointer-events:none}
.dg .mk{fill:var(--heat);stroke:var(--surface);stroke-width:2}
.dg .mkl{stroke:var(--heat);stroke-width:1;stroke-dasharray:3 3}
.dg-ctrl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.dg-ctrl label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.dg-ctrl input{width:100%;accent-color:var(--heat)}
.dg-info{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.dg-info h3{font-size:22px}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 12px;font-size:14.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}

.mobile-nav{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .mobile-nav{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);overflow-x:auto;gap:2px;padding:8px 16px}
  .mobile-nav a{white-space:nowrap;padding:7px 11px;border-radius:999px;text-decoration:none;color:var(--ink);font-size:14px;font-weight:500}
  .mobile-nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
  main{padding-block:20px 48px;padding-inline:16px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .topic{grid-template-columns:minmax(0,1fr)}
  .q-body{padding-left:16px}
  .cmp,.dg-info,.dg-ctrl{grid-template-columns:minmax(0,1fr)}
  .view-head h1{font-size:25px}
  .reader-head h2{font-size:23px}
}
@media (prefers-reduced-motion:reduce){ .card-in{transition:none} }
/* Wide slide crops: keep figures inside the column */
.figs>figure,.plate{min-width:0}
.plate img{max-width:100%;min-width:0;height:auto;object-fit:contain}

/* Orbits explorer */
.ob{cursor:pointer}
.ob .lay{stroke:var(--surface);stroke-width:1}
.ob .l0{fill:#DCE8F5}.ob .l1{fill:#CFDDF0}.ob .l2{fill:#C2D1EA}.ob .l3{fill:#B3C2E2}.ob .l4{fill:#A3B1D6}.ob .l5{fill:#8E9BC6}
.ob .lay.on{fill:var(--heat-soft);stroke:var(--heat)}
.ob .orb{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.2}
.ob .o-geo{fill:var(--accent)}
.ob .o-gto,.ob .o-heo{fill:none;stroke-dasharray:4 3}
.ob .olbl{fill:var(--accent);font-family:var(--f-mono);font-size:12px;font-weight:500;pointer-events:none}
.ob .mkb.obj,.ob .mk2.obj{fill:var(--good)}
.ob .mkb.haz,.ob .mk2.haz{fill:var(--bad)}
.ob .mlbl{fill:var(--ink);font-size:11.5px;pointer-events:none}

<li>Բարձր ճշգրտության «ալֆա» նախատիպի ցուցադրում համապատասխան միջավայրում։</li>

  { h: "Ճառագայթում և ուղեծրային խանգարումներ", html: `

<h4>Ճառագայթում</h4>
<ul><li><b>Վան Ալլենի գոտիներ</b>․ ներքին գոտին գտնվում է <b>1000–13 000 կմ</b> բարձրությունների վրա և պարունակում է <b>բարձր էներգիայի պրոտոններ</b>։</li>
<li><b>Հարավատլանտյան անոմալիա (SAA)</b>․ սովորաբար հանդիպում է Երկրից <b>200–800 կմ</b> բարձրության վրա։</li>
<li>Բացի այդ, կա նաև <b>Արեգակնային ճառագայթում</b>։</li></ul>
<h4>Խանգարումներ (Perturbations)</h4>
<p><b>Խանգարումը</b> փոքր ուժ կամ ազդեցություն է, որը շեղում է առաջացնում արբանյակի <b>իդեալական ուղեծրից</b>։ Տարածված տեսակներն են՝</p>
<ol><li>մթնոլորտային դիմադրություն,</li><li>Երկրի փքվածություն (սեղմվածություն),</li><li>Լուսնի և Արեգակի ձգողության ուժ,</li><li>մագնիսական դաշտի փոխազդեցություններ և այլն։</li></ol>

  { h: "Նախագծի ղեկավարման ձևը", html: `
<p>Ավիատիեզերական սարքաշինության նախագծի ղեկավարումը լինում է <b>երեք կողմանի</b>․</p>

<dt>Ծրագրի ղեկավար (Project Manager)</dt><dd>Ղեկավարում է բոլոր <b>թասքերը, ժամկետները, բյուջեն, ռիսկերը</b>, հաշվետու է շահագրգիռ կողմերին, ներառյալ գլխավոր գիտնականին։</dd>
<dt>Համակարգերի ճարտարագետ (Systems Engineer)</dt><dd>Պատասխանատու է <b>ինժեներատեխնիկական թիմի</b> համար, հաշվետու է ծրագրի ղեկավարին։</dd>

<h4>Տիեզերական նախագծի փուլերը</h4>

<li><b>Երկրային (վերգետնյա) կայաններ</b>՝ կապի ցանց (Communication Network), հրամանատարություն և կառավարում (Command and Control),</li>
<li><b>Տրանսպորտացիա</b> (արձակման հրթիռ),</li>
<li><b>Առաքելության կառավարման սենյակ</b> (կառավարման կենտրոն),</li>
<li><b>Տվյալների բաշխում</b>՝ արձագանքման ժամանակ (Response Time) և տվյալների տարածում (Data Distribution)։</li></ul>`,

// Written questions by lecture
questions: [
 { id: "1.1", sec: [0], t: 1, l: 1, q: "Ինչ է արբանյակը։ Բնական և արհեստական արբանյակներ", a: `
<ul><li>Արբանյակը տիեզերքում գտնվող օբյեկտ է, որը պտտվում է ավելի մեծ օբյեկտի շուրջ։</li>
<li>Բնական՝ լուսիններ մոլորակի կամ աստղի շուրջ․ բոլոր մոլորակներն ունեն, բացի Մերկուրիից և Վեներայից։</li>
<li>Արհեստական՝ անօդաչու սարքեր կամ կառավարվող ռոբոտներ։</li>
<li>Առաջինը՝ Sputnik 1, արձակվել է 1957 թ. հոկտեմբերի 4-ին։</li>
<li>Արբանյակաշինությունը պահանջում է համակարգված մոտեցում։</li></ul>` },
 { id: "1.2", sec: [1], t: 1, l: 1, q: "Տիեզերական ճարտարագիտություն։ Spacecraft Engineering և Space Engineering տարբերությունը", a: `
<ul><li>Բազմամասնագիտական ոլորտ՝ արբանյակներ, տիեզերանավեր, ինքնաթիռներ, որոնք գործում են մթնոլորտից դուրս․ համակարգերի նախագծում, զարգացում, շահագործում։</li>
<li>Spacecraft Engineering՝ տիեզերական մեքենայի նախագծում, կառուցում, փորձարկում, շահագործում սկզբից մինչև վերջ․ ենթահամակարգերի ինժեներություն և կյանքի ցիկլ։</li>
<li>Space Engineering՝ ամբողջական տիեզերական համակարգի ճարտարապետություն․ հրթիռի ընտրություն, վերգետնյա կառավարում, ուղեծրեր և համաստեղություններ, օգտակար բեռներ, առաքելության գործողություններ։</li>
<li>Առաքելությունների տեսականին՝ արձակման հրթիռներ, Երկիր, մարդը տիեզերքում, Արեգակնային համակարգ, տիեզերք, ISS։</li></ul>` },
 { id: "1.3", sec: [2], t: 1, l: 1, q: "Փոքր արբանյակների դասակարգումն ըստ զանգվածի և ծավալի (U)", a: `
<ul><li>1U = 10×10×10 սմ․ 3U ≈ 30 սմ (Juno-ն ≈ 20 մ)։</li>
<li>Պիկո՝ 0.1–1 կգ (1U), նանո՝ 1–10 կգ (3U, 6U), միկրո՝ 10–100 կգ (12U), մինի՝ 100–500 կգ։</li>
<li>Փոքր արբանյակներ՝ մինչև 500 կգ։</li>
<li>Ձևաչափեր՝ 1U, CanSat, 0.5U, 0.25U, 5×5×5 սմ։</li>
<li>Մեծ տիեզերանավեր՝ Voyager, New Horizons (&lt;1000 կգ), Juno (&lt;5000 կգ), Cassini, Hubble (&lt;10 000 կգ)։</li></ul>` },
 { id: "1.4", sec: [3,6], t: 1, l: 1, q: "CubeSat-ը և դրա ձևաչափերը։ Հիմնադիրները և արդյունաբերության կարիքները", a: `
<ul><li>CubeSat-ը փոքր արբանյակ է՝ 1U խորանարդ միավորներից։</li>
<li>Հիմնադիրներ՝ Earnest Robinson, Henry Helvajian, Bob Twiggs, Jordi Puig-Suari։</li>
<li>Ձևաչափեր՝ 12U (Aoxiang Zhixing), 6U (EcAMSat, ALTAIR 1), 2U (ION), 1.5U (FIREBIRD), 0.5U (AeroCube 6), 0.25U (Space Bee), CanSat։</li>
<li>Արբանյակ = բաս + օգտակար բեռ։</li></ul>` },
 { id: "1.5", sec: [4], t: 1, l: 1, q: "Համակարգի սահմանումը (INCOSE) և տիեզերական համակարգի հիերարխիան", a: `
<ul><li>Համակարգը փոխազդող տարրերի համակցություն է, կազմակերպված մեկ կամ մի քանի նշված նպատակներին հասնելու համար (INCOSE SE Handbook V3.2)։</li>
<li>Հիերարխիա՝ համակարգ → ենթահամակարգեր → հավաքույթներ (assemblies) → բաղադրիչներ → տեխնոլոգիաներ։</li>
<li>Յուրաքանչյուր մակարդակ ներառված է վերինի մեջ։</li></ul>` },
 { id: "1.6", sec: [5], t: 1, l: 1, q: "Փոքր արբանյակների առաքելության նպատակները (գործածման եղանակները)", a: `
<ul><li>TD՝ տեխնոլոգիայի ցուցադրում։</li>
<li>SSI՝ տիեզերական գիտությունների ուսումնասիրություն։</li>
<li>Com՝ հաղորդակցություն, Edu՝ ուսումնական։</li>
<li>EO՝ Երկրի դիտում, SPI՝ մոլորակային գիտություն և հետախուզում։</li>
<li>Նպատակը՝ Հայաստանի ապահովություն և անվտանգություն։</li></ul>` },
 { id: "1.7", sec: [6], t: 1, l: 1, q: "Արբանյակի բասը։ Բասի ընտրությունը և կայունացման եղանակները", a: `
<ul><li>Արբանյակ = Bus + Payload․ բասը՝ ADCS, OBC, Comm, EPS, արևային պանելներ, ալեհավաք։</li>
<li>Պտտման առանցքով կայունացված (Spin Axis Stabilized) բաս՝ կողմնորոշումը պահում է պտույտը։</li>
<li>Եռառանցք կայունացված (Cassini)՝ շարժիչներ (thrusters) և ռեակցիոն անիվներ։</li></ul>` },
 { id: "1.8", sec: [7], t: 1, l: 1, q: "Տեխնոլոգիական պատրաստվածության մակարդակները (TRL 1–9)", a: `
<ul><li>TRL 1–2՝ հիմնարար հետազոտություն և տեխնոլոգիայի զարգացում։</li>
<li>TRL 3–4՝ գաղափարի ապացույց և լաբորատոր մակետ։</li>
<li>TRL 5–6՝ տեխնոլոգիայի ցուցադրում (ալֆա նախատիպ համապատասխան միջավայրում)։</li>
<li>TRL 7՝ փորձարկում, ստուգում և վավերացում (բետա նախատիպ գործառնական միջավայրում)։</li>
<li>TRL 8՝ փորձարկում համակարգի կազմում (որակավորված), TRL 9՝ հաջող կիրառում տիեզերքում (սերտիֆիկացված)։</li>
<li>CubeSat առաքելությունները պահանջում են TRL 9՝ թռիչքային որակավորմամբ բաղադրիչներ։</li></ul>` },
 { id: "2.1", sec: [1], t: 2, l: 2, q: "Վերգետնյա, օդային և տիեզերական դիտարկման հարթակները և դրանց բարձրությունները", a: `
<ul><li>Օդային համակարգեր՝ դրոններ, անօդաչու ինքնաթիռներ, պարապլաններ, ուղղաթիռներ, ինքնաթիռներ։</li>
<li>Դրոն ≈ 150 մ, օդային հեռուստատեսություն 0.3 կմ, օդային լուսանկարահանում 1.2–3.5 կմ, օդային SAR 10–12 կմ։</li>
<li>Space Shuttle 185–575 կմ, արբանյակ (օպտիկական սենսոր/SAR) 700–900 կմ։</li></ul>` },
 { id: "2.2", sec: [2], t: 2, l: 2, q: "Հաղորդակցության և կառավարման կապերը (դաշտ, UAV, արբանյակ, վերգետնյա կայան)", a: `
<ul><li>Մասեր՝ (A) դաշտ, (B) UAV ցանց, (C) արբանյակային կառավարման համակարգ, (D) վերգետնյա կառավարման կայան։</li>
<li>Հաղորդակցության կապեր՝ UAV ↔ UAV, UAV ↔ դաշտ, ներքին կապ սենսորային դաշտում։</li>
<li>Կառավարման կապեր՝ UAV ↔ UAV, UAV ↔ CS, արբանյակ ↔ UAV-ներ և CS։</li>
<li>Կայանի գործառույթներ՝ դաշտի տվյալներ, UAV-ների կառավարում, սպասարկում․ Քարմանի գիծը բաժանում է օդայինը տիեզերականից։</li></ul>` },
 { id: "2.3", sec: [3], t: 2, l: 2, q: "Տիեզերական միջավայրը և դրա ազդեցությունը արբանյակի վրա", a: `
<ul><li>Ճառագայթում և լիցքավորված մասնիկներ։</li>
<li>Ձգողականություն, մթնոլորտ (դիմադրություն), վակուում։</li>
<li>Ջերմաստիճան (մեծ տարբերություններ)։</li>
<li>Միկրոմետեորիտներ և տիեզերական աղբ։</li>
<li>Կյանքն ու աշխատանքը տիեզերքում։</li></ul>` },
 { id: "2.4", sec: [4], t: 2, l: 2, q: "Մթնոլորտի շերտերը։ Որտեղից է սկսվում տիեզերքը", a: `
<ul><li>Տրոպոսֆերա 0–10(12) կմ՝ T-ն նվազում է, օդը նոսրանում է։</li>
<li>Ստրատոսֆերա մինչև 50 կմ՝ տաք, օզոնային շերտ։</li>
<li>Մեզոսֆերա մինչև 85 կմ՝ ցուրտ, −90 °C։</li>
<li>Թերմոսֆերա 85 → 500–1000 կմ՝ 1500 °C, շատ ցածր խտություն, ISS, բևեռափայլ, իոնոսֆերա։</li>
<li>Էկզոսֆերա 1000 → ~10 000 կմ՝ ջրածին և հելիում։</li>
<li>Տիեզերքը սկսվում է Քարմանի գծից՝ ≈ 100 կմ (62 մղոն)։</li></ul>` },
 { id: "2.5", sec: [5], t: 2, l: 2, q: "Հիմնական ֆիզիկական մեծություններ․ զանգված, իներցիա, քաշ, էներգիա, իմպուլս", a: `
<ul><li>Զանգված՝ որքան նյութ ունի մարմինը։</li>
<li>Իներցիա՝ որքան դժվար է մարմինը տեղափոխել։</li>
<li>Քաշ՝ ձգողականության ազդեցությունը զանգվածի վրա։</li>
<li>Էներգիա՝ պոտենցիալ և կինետիկ։</li>
<li>Գծային իմպուլս = զանգված × արագություն․ անկյունային իմպուլսը պտտվող հատկությունների չափանիշն է։</li></ul>` },
 { id: "2.6", sec: [6], t: 2, l: 2, q: "LEO և MEO ուղեծրերը", a: `
<ul><li>LEO՝ 160–1500 կմ, պարբերություն 90–120 րոպե, օրական մինչև 16 պտույտ։</li>
<li>LEO-ն հարմար է հեռազննման, Երկրի դիտարկման, գիտական հետազոտությունների համար՝ տվյալները արագ են ստացվում։</li>
<li>LEO օպերատորներ՝ Iridium, Globalstar, Orbcomm․ տասնյակ-հարյուրավոր արբանյակներ՝ mesh ցանց։</li>
<li>MEO՝ 5000–20 000 կմ, նավիգացիա՝ GPS, GLONASS, Galileo (GNSS)։</li></ul>` },
 { id: "2.7", sec: [6], t: 2, l: 2, q: "GEO, GTO և SSO ուղեծրերը", a: `
<ul><li>GEO՝ 35 786 կմ, ճշգրիտ հասարակածի վերևում․ 3 հավասարաչափ արբանյակը ծածկում է գրեթե ամբողջ աշխարհը (Inmarsat, Eutelsat, Astra)։</li>
<li>GTO՝ փոխանցման ուղեծիր դեպի GEO․ հրթիռը թողնում է արբանյակը GTO-ում, արբանյակի շարժիչը հասցնում է GEO և կարգավորում թեքությունը։</li>
<li>SSO՝ 600–800 կմ, հյուսիս–հարավ բևեռներով, անցնում է տրված վայրով նույն տեղական արեգակնային ժամին → նույն լուսավորություն, իդեալական Երկրի դիտարկման համար։</li>
<li>Գեոստացիոնար՝ հասարակածային, գեոսինխրոն՝ նույն պարբերությամբ, բայց թեքված։ Որքան բարձր, այնքան մեծ ծածկույթ։</li></ul>` },
 { id: "2.8", sec: [7], t: 2, l: 2, q: "Ճառագայթումը (Վան Ալլենի գոտիներ, SAA) և ուղեծրային խանգարումները", a: `
<ul><li>Վան Ալլենի ներքին գոտի՝ 1000–13 000 կմ, բարձր էներգիայի պրոտոններ։</li>
<li>Հարավատլանտյան անոմալիա (SAA)՝ 200–800 կմ․ նաև Արեգակնային ճառագայթում։</li>
<li>Խանգարումը փոքր ուժ է, որը շեղում է արբանյակը իդեալական ուղեծրից։</li>
<li>Տեսակներ՝ մթնոլորտային դիմադրություն, Երկրի փքվածություն, Լուսնի և Արեգակի ձգողություն, մագնիսական դաշտի փոխազդեցություն։</li>
<li>600 կմ-ից ցածր արբանյակները հակված են անկման (դիմադրություն)․ Արեգակնային ակտիվությունն ազդում է կյանքի տևողության վրա։</li></ul>` },
 { id: "2.9", sec: [8,10], t: 2, l: 2, q: "Արբանյակների չորս տեսակները ըստ կիրառման և օրինակներ", a: `
<ul><li>Կապի՝ GEO-ում, ընդունում և վերահաղորդում են ազդանշաններ (ռադիո, TV, հեռախոս, ինտերնետ)․ Starlink, Inmarsat, Intelsat։</li>
<li>Երկրի դիտարկման՝ վերահսկում են մոլորակը և հաղորդում փոփոխությունների մասին․ Sentinel-2, Landsat-9, Terra։</li>
<li>Նավիգացիոն՝ 20 000–37 000 կմ, ժամանակ, դիրք, վիճակ․ GPS, GLONASS, BeiDou։</li>
<li>Աստղագիտական՝ աստղադիտակներ առանց մթնոլորտի միջամտության, ինֆրակարմիր պատկերում․ James Webb, Hubble, Planck։</li>
<li>Նաև՝ եղանակային (GOES-16, Meteosat), տեխնոլոգիական ցուցադրություն (TechDemoSat), միջմոլորակային (Juno, Voyager)։</li></ul>` },
 { id: "2.10", sec: [9], t: 2, l: 2, q: "Օգտակար բեռը․ կապի բեռ և հեռազննում (պասիվ և ակտիվ)", a: `
<ul><li>Կապի բեռ՝ GEO, տրանսպոնդերներ (ռադիոալիքների ընդունիչ + հաղորդիչ)։</li>
<li>Հեռազննում՝ միջավայրի մոնիթորինգ, քարտեզագրում․ ուղեծրեր՝ բևեռային, շրջանաձև, GEO։</li>
<li>Պասիվ՝ բազմասպեկտրային/հիպերսպեկտրային սենսորներ, տեսանելի, IR, մոտ IR, ջերմային IR, միկրոալիքային։</li>
<li>Ակտիվ՝ ինքն է արձակում ազդանշան և չափում անդրադարձը․ ռադար, լիդար, լազերային բարձրաչափ, զոնդեր, սկատերոմետր։</li>
<li>Եղանակային արբանյակներ՝ իրական ժամանակի տվյալներ, GEO-ն իդեալական է։</li></ul>` },
 { id: "2.11", sec: [9], t: 2, l: 2, q: "Նավիգացիոն և աստղագիտական բեռներ։ GNSS և RNSS", a: `
<ul><li>Նավիգացիա՝ 20 000–37 000 կմ, ազդանշաններ՝ ճշգրիտ ժամանակ, դիրք, տեխնիկական վիճակ։</li>
<li>GNSS՝ գլոբալ ծածկույթ․ Galileo (Եվրոպա), GPS (ԱՄՆ), BeiDou (Չինաստան)։</li>
<li>RNSS՝ տարածաշրջանային ինքնավար համակարգ․ Հնդկաստանի IRNSS։</li>
<li>Աստղագիտական՝ դիտում առանց մթնոլորտի, քարտեզներ և պատկերներ։</li>
<li>Կլիմայի արբանյակներ (օվկիանոս, սառույց, ցամաք, կենսոլորտ, մթնոլորտ) և բիոարբանյակներ (բջիջներ, բժշկություն, կենսաբանություն)։</li></ul>` },
 { id: "2.12", sec: [11], t: 2, l: 2, q: "Արբանյակի պլատֆորմը (Bus) և դրա ենթահամակարգերը", a: `
<ul><li>OBC՝ ներդիր համակարգիչ։</li>
<li>EPS՝ էլեկտրաէներգիայի ենթահամակարգ։</li>
<li>ADCS՝ դիրքորոշման որոշում և կառավարում։</li>
<li>Comm՝ կապի ենթահամակարգ։</li>
<li>Ջերմային, շարժիչային, կառուցվածքային ենթահամակարգեր։</li>
<li>Payload + Bus = Satellite։</li></ul>` },
 { id: "2.13", sec: [12], t: 2, l: 2, q: "CubeSat ստանդարտը։ Ինչ պայմանների պետք է դիմանա CubeSat-ի կառուցվածքը", a: `
<ul><li>Տիեզերքը պատկանում է բոլորին, բայց ենթարկվում է խիստ կանոնների։</li>
<li>CubeSat՝ 10×10×10 սմ, 1.3 կգ․ 1U՝ 100×100×113.5 մմ, 3U՝ 100×100×340.5 մմ, 6U՝ 100×226.3×366, 12U՝ 226.3×226.3×366 մմ։</li>
<li>CanSat՝ տուփ 12.2 սմ բարձրությամբ, 6.62 սմ տրամագծով։</li>
<li>Պայմաններ՝ մեխանիկական բեռներ, ջերմային կարգավորում, ճառագայթակայունություն, վակուումային համատեղելիություն։</li>
<li>Նաև՝ էլեկտրամագնիսական համատեղելիություն, ուղեծրային պայմաններ, բացման մեխանիզմներ։</li></ul>` },
 { id: "3.1", sec: [0,1], t: 3, l: 3, q: "Փոքր արբանյակի տարրերը (1U CubeSat-ի օրինակով) և արբանյակի տարրերը լայն իմաստով", a: `
<ul><li>Ալեհավաք (UHF դիպոլ), կառուցվածք (ISIS 1U շրջանակ), արևային պանելներ։</li>
<li>Էլեկտրասնուցում (NanoPower P31u), թռիչքի կառավարման համակարգիչ (NanoMind A712C), UHF հաղորդիչ-ընդունիչ (NanoCom U482C)։</li>
<li>Սպեկտրոմետր և օգտակար բեռ (Arduino համակարգիչ և սենսորներ)։</li>
<li>Լայն իմաստով՝ տեխնոլոգիաներ, hardware/software, մարդիկ և կազմակերպություններ, օբյեկտներ, քաղաքականություն, ծառայություն, փաստաթղթեր, օրենքներ։</li>
<li>Նաև՝ ստանդարտներ, տիեզերական գիտություններ, հաղորդակցություն, լոգիստիկա, Երկրի դիտում, ԱԲ, կիբեռանվտանգություն։</li></ul>` },
 { id: "3.2", sec: [2], t: 3, l: 3, q: "Համակարգի նկարագրությունը և պահանջները։ Բաղադրիչների և համակարգային ճարտարագիտության տարբերությունը", a: `
<ul><li>Նկարագրություն՝ տրամաբանական (հաջորդական), ֆիզիկական, տեխնիկական։</li>
<li>Տրամաբանական և ֆիզիկական նկարագրությունների հայտարարությունները կոչվում են պահանջներ։</li>
<li>Բաղադրիչների ճարտարագիտություն՝ «ի՞նչ կարող եմ անել» (what can be done)։</li>
<li>Համակարգային ճարտարագիտություն՝ «ի՞նչ պետք է անել» (what should be)։</li></ul>` },
 { id: "3.3", sec: [4], t: 3, l: 3, q: "Տեխնոլոգիաների տեսակները և տեխնոլոգիայի ճանապարհը մինչև համակարգի բաղադրիչ", a: `
<ul><li>Ցածր տեխնոլոգիա՝ չի պահանջում ծանր տեխնիկա, չկան համակարգիչներ։</li>
<li>Միջին՝ բարդ տեխնիկայի որոշակի մակարդակ, համակարգչային էլեկտրոնիկա։</li>
<li>Բարձր՝ բարձր մակարդակի տեխնիկա, վերջին տեխնոլոգիաներ, համակարգչային էլեկտրոնիկա։</li>
<li>Տեխնոլոգիան ծրագրվում, գնահատվում, ղեկավարվում, փոխանցվում և դառնում արտադրանք։</li>
<li>Առևտրայնացվում, գնարժեքավորվում և դառնում համակարգի բաղադրիչի հիմնական մասը։</li></ul>` },
 { id: "3.4", sec: [5], t: 3, l: 3, q: "Ավիատիեզերական նախագծի ղեկավարման երեք կողմերը և դերերը", a: `
<ul><li>Գլխավոր գիտնական՝ որոշում է առաքելության նպատակը և կարևորությունը, հաշվետու է հովանավորին/ֆինանսավորողին։</li>
<li>Ծրագրի ղեկավար՝ թասքեր, ժամկետներ, բյուջե, ռիսկեր, հաշվետու է շահագրգիռ կողմերին (ներառյալ գլխավոր գիտնականին)։</li>
<li>Համակարգերի ճարտարագետ՝ պատասխանատու է ինժեներական թիմի համար, հաշվետու է ծրագրի ղեկավարին։</li>
<li>Շղթա՝ հաճախորդ → տեխնոլոգիա → համակարգ → Bus (գլխավոր ինժեներ) + Payload (բեռի ինժեներ) → արբանյակ → հրթիռ (հրթիռի ինժեներ)։</li></ul>` },
 { id: "3.5", sec: [6], t: 3, l: 3, q: "Տիեզերական թռիչքի նախագծի կառուցվածքը (01–11)", a: `
<ul><li>01 նախագծի ղեկավարում, 02 համակարգային ճարտարագիտություն, 03 անվտանգություն և առաքելության երաշխավորում։</li>
<li>04 գիտություն/տեխնոլոգիա, 05 օգտակար բեռներ, 06 տիեզերանավ, 07 առաքելության գործողություններ։</li>
<li>08 արձակման հրթիռ/ծառայություններ, 09 վերգետնյա համակարգեր։</li>
<li>10 համակարգերի ինտեգրում և փորձարկում, 11 կրթություն և հանրային իրազեկում։</li></ul>` },
 { id: "3.6", sec: [7], t: 3, l: 3, q: "Նախագծի կյանքի ցիկլի փուլերը (Pre-Phase A – Phase F)", a: `
<ul><li>Ընդհանուր մոդել՝ հետազոտություն → հայեցակարգ → զարգացում → արտադրում → օգտագործում → աջակցում → մեկուսացում․ փուլերը փոխկապակցված են, կարող են համակցվել կամ համընկնել։</li>
<li>Pre-Phase A՝ հայեցակարգի ուսումնասիրություն (նախաձևակերպում)։</li>

 "l3-exploded","l3-mgmt","l3-wbs","l3-stairs","l3-lifecycle","l3-reviews","l3-ground"].forEach(k => window.IMG[k] = 'img/' + k + '.webp');
</script>
<script>
(function(){
const D = window.DATA, IMG = window.IMG || {};
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip = h => h.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

/* ---------- storage (per-viewer convenience; app works without it) ---------- */
const KEY = 'smallsat-mt1-v1';
let S = { read:{}, rate:{}, known:{}, quiz:[], sup:true, draft:{}, chk:{} };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e){}
S.draft = S.draft || {}; S.chk = S.chk || {}; S.qmode = S.qmode || 'study';
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };

const ICONS = {
  home:'<path d="M3 10.5 12 4l9 6.5V20h-6v-6H9v6H3z"/>',
  lectures:'<path d="M4 5h6a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H4zM20 5h-6a3 3 0 0 0-3 3"/><path d="M20 5v13h-7"/>',
  questions:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.2v.1"/>',
  cards:'<rect x="3" y="6" width="14" height="13" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v11"/>',
  quiz:'<path d="M4 6h16M4 12h10M4 18h7"/><path d="m15 17 2 2 4-4"/>',
  exam:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/>',
  orbits:'<circle cx="12" cy="12" r="3"/><ellipse cx="12" cy="12" rx="10" ry="4.5" transform="rotate(-25 12 12)"/><circle cx="20" cy="8" r="1.2"/>'
};
const VIEWS = [
  ['home','Գլխավոր'],['lectures','Դասախոսություններ'],['questions','Գրավոր հարցեր'],
  ['exam','Քննության փորձ'],['cards','Քարտեր'],['orbits','Ուղեծրեր'],['quiz','Թեստ']
];
function buildNav(cur){
  $('#nav').innerHTML = VIEWS.map(([id,t]) => `<a href="#${id}" ${cur===id?'aria-current="page"':''}><svg class="ic" viewBox="0 0 24 24">${ICONS[id]}</svg>${t}</a>`).join('');
  $('#mnav').innerHTML = VIEWS.map(([id,t]) => `<a href="#${id}" ${cur===id?'aria-current="page"':''}>${t}</a>`).join('');
}

const lecById = id => D.lectures.find(l => l.id === +id);
const TOPICS = {1:'Փոքր արբանյակների ծավալը, կառուցվածքը, առաքելությունը',2:'Տիեզերական միջավայր, ուղեծրեր, օգտակար բեռ և պլատֆորմ',3:'Տարրեր, տեխնոլոգիաներ, նախագծի ղեկավարում և կյանքի ցիկլ'};
const THEMES = Object.keys(TOPICS).map(Number);
const RATE_T = ['Չգնահատված','Չգիտեմ','Մասամբ','Գիտեմ'];
const rateOf = id => S.rate[id] || 0;

/* ---------- figures ---------- */
function figHTML(f){
  const [id, cap] = f; if (!IMG[id]) return '';
  return `<figure><div class="plate" data-zoom="${id}" role="button" tabindex="0" aria-label="Մեծացնել նկարը"><img src="${IMG[id]}" alt="${esc(cap)}" loading="lazy"></div><figcaption><b>Նկ․</b> ${esc(cap)}</figcaption></figure>`;
}
document.addEventListener('click', e => {
  const z = e.target.closest('[data-zoom]');
  if (z){ const id = z.dataset.zoom; $('#lb-img').src = IMG[id]; $('#lb-cap').textContent = z.querySelector('img').alt; $('#lb').hidden = false; }
  const go = e.target.closest('[data-go]');
  if (go){ e.preventDefault(); location.hash = go.dataset.go; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') $('#lb').hidden = true;
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-zoom]')) { e.preventDefault(); e.target.click(); }
});
$('#lb').addEventListener('click', e => { if (e.target.id !== 'lb-img') $('#lb').hidden = true; });
const wrapTables = html => html.replace(/<table class="tbl">/g,'<div class="tbl-wrap"><table class="tbl">').replace(/<\/table>/g,'</table></div>');

/* ---------- HOME ---------- */
function viewHome(){
  const qs = D.questions;
  const rated = qs.filter(q => rateOf(q.id)===3).length;
  const readN = D.lectures.filter(l => S.read[l.id]).length;
  const knownN = D.cards.filter((c,i) => S.known[i]).length;
  const best = S.quiz.length ? Math.max(...S.quiz.map(r => Math.round(100*r.s/r.n))) : null;
  const groups = THEMES.map(t => {
    const items = qs.filter(q => q.t===t);
    const lec = [...new Set(items.map(q=>q.l))].map(n=>'Դաս. '+n).join(', ');
    return `<div class="topic"><div><h3>Դաս. ${t}. ${TOPICS[t]}</h3><p>${items.length} հարց · ${lec}</p></div>
      <div class="segbar" title="${items.map(q=>q.id+': '+RATE_T[rateOf(q.id)]).join('\n')}">${items.map(q=>`<i class="r${rateOf(q.id)}"></i>`).join('')}</div></div>`;
  }).join('');
  const weak = qs.filter(q => rateOf(q.id) < 3).sort((a,b) => (rateOf(a.id)||1.5) - (rateOf(b.id)||1.5)).slice(0,4);
  return `<div class="view">
    <header class="view-head"><span class="eyebrow">Առաջին միջանկյալ · դասախոսություններ 1–3</span><h1>Ուսումնական վահանակ</h1>
    <p class="lede">Կարդացեք դասախոսությունը, գրեք հարցի պատասխանը, ստուգեք այն և գնահատեք ձեզ։ Այստեղ կտեսնեք, թե որ թեմաներն են դեռ թույլ։ Բովանդակությունը կազմված է Մ. Հ. Պողոսեանի դասախոսությունների սլայդներից։</p></header>
    <div class="stats">
      <div class="stat"><b>${readN}/${D.lectures.length}</b><span>դասախոսություն կարդացված</span></div>
      <div class="stat"><b>${rated}/${qs.length}</b><span>հարց «Գիտեմ»</span></div>
      <div class="stat"><b>${knownN}/${D.cards.length}</b><span>քարտ սովորած</span></div>
      <div class="stat"><b>${qs.filter(q=>(S.draft[q.id]||'').trim()).length}/${qs.length}</b><span>հարց գրավոր պատասխանված</span></div>
    </div>
    <section class="panel"><div class="row" style="justify-content:space-between;margin-bottom:6px"><h2 style="font-size:19px">Պատրաստվածություն ըստ թեմաների</h2>
      <div class="legend"><span><i style="background:var(--good)"></i>Գիտեմ</span><span><i style="background:var(--warn)"></i>Մասամբ</span><span><i style="background:var(--bad)"></i>Չգիտեմ</span><span><i style="background:var(--sunk);border:1px solid var(--line)"></i>Չգնահատված</span></div></div>
      <div class="topics">${groups}</div></section>
    ${weak.length ? `<section class="qgroup"><h2 style="font-size:19px">Հաջորդը կրկնել</h2>${weak.map(q=>`<a class="hit" href="#questions" data-open="${q.id}" style="text-decoration:none;color:inherit"><b>${q.id} · ${RATE_T[rateOf(q.id)]}</b>${esc(q.q)}</a>`).join('')}</section>` : `<section class="panel"><b>Բոլոր հարցերը նշված են «Գիտեմ»։</b> Անցեք <a href="#exam">քննության փորձին</a>։</section>`}
    <section class="qgroup"><h2 style="font-size:19px">Ինչպես պարապել</h2>
    <div class="steps">
      <div class="step"><b>Կարդալ</b>Դասախոսության կոնսպեկտ և նկարներ<a href="#lectures">Դասախոսություններ</a></div>
      <div class="step"><b>Սովորել → Գրել</b>Կարդացեք պատասխանը, հետո գրեք և ստուգեք<a href="#questions">Գրավոր հարցեր</a></div>
      <div class="step"><b>Ամրացնել</b>Սահմանումներ և թվեր քարտերով<a href="#cards">Քարտեր</a></div>
      <div class="step"><b>Փորձել</b>3 հարց՝ յուրաքանչյուր դասից, 45 րոպե<a href="#exam">Քննության փորձ</a></div>
      <div class="step"><b>Լրացուցիչ</b>${D.quiz.length} արագ թեստային հարց<a href="#quiz">Թեստ</a></div>
    </div></section>
  </div>`;
}
document.addEventListener('click', e => { const a = e.target.closest('[data-open]'); if (a) openQ = a.dataset.open; });

/* ---------- LECTURES ---------- */
let curLec = 1, lecQuery = '';
function viewLectures(){
  const l = lecById(curLec);
  const tabs = D.lectures.map(x => `<button aria-pressed="${x.id===curLec}" data-lec="${x.id}">${S.read[x.id]?'<span class="dot" title="Կարդացված"></span>':''}Դաս. ${x.id}</button>`).join('');
  let body;
  if (lecQuery.trim().length > 1){
    const q = lecQuery.trim().toLowerCase(), hits = [];
    D.lectures.forEach(L => L.sections.forEach((s,i) => { const t = strip(s.html); const k = t.toLowerCase().indexOf(q); if (k>=0 || s.h.toLowerCase().includes(q)) hits.push({L,i,s,t,k}); }));
    body = `<div class="search-hits"><p class="note">${hits.length} արդյունք «${esc(lecQuery)}»-ի համար</p>${hits.map(h => {
      const a = Math.max(0,h.k-60), frag = h.k>=0 ? (a?'…':'')+esc(h.t.slice(a,h.k+120))+'…' : esc(h.t.slice(0,140))+'…';
      const re = new RegExp(esc(lecQuery.trim()).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
      return `<button class="hit" data-jump="${h.L.id}:${h.i}"><b>Դասախոսություն ${h.L.id} · ${esc(h.s.h)}</b>${frag.replace(re, m=>`<mark>${m}</mark>`)}</button>`;}).join('')}</div>`;
  } else {
    body = `<article class="reader ${S.sup?'sup-on':''}">
      <header class="reader-head"><span class="eyebrow">Դասախոսություն ${l.id} · ${l.date}</span><h2>${l.title}</h2>
      <nav class="toc">${l.sections.map((s,i)=>`<a href="#lectures" data-jump="${l.id}:${i}">${s.h}</a>`).join('')}</nav></header>
      ${l.sections.map((s,i) => `<section class="sec" id="s${l.id}-${i}"><h3><span class="n">${l.id}.${i+1}</span>${s.h}</h3>
        <div class="prose">${wrapTables(s.html)}</div>
        ${s.figs ? `<div class="figs">${s.figs.map(figHTML).join('')}</div>` : ''}</section>`).join('')}
      <footer class="reader-foot">
        <button class="btn ${S.read[l.id]?'':'primary'}" id="markread">${S.read[l.id]?'✓ Կարդացված է':'Նշել որպես կարդացված'}</button>
        <a class="btn" href="#questions" data-qlec="${l.id}">Հարցեր այս թեմայից</a>
        <a class="btn" href="#quiz" data-zlec="${l.id}">Թեստ այս դասախոսությունից</a>
        ${l.id<D.lectures.length?`<button class="btn" data-lec="${l.id+1}">Հաջորդ դասախոսություն →</button>`:''}
      </footer></article>`;
  }
  return `<div class="view">
    <header class="view-head"><span class="eyebrow">Կոնսպեկտ</span><h1>Դասախոսություններ</h1>
    <p class="lede">Սլայդների բովանդակությունը՝ մաքրված և կառուցվածքավորված, բնօրինակ նկարներով (սեղմեք՝ մեծացնելու համար)։</p></header>
    <div class="row" style="justify-content:space-between">
      <input type="search" id="lecq" placeholder="Որոնել տերմին, օր․ CubeSat" value="${esc(lecQuery)}" style="flex:1;min-width:200px;max-width:360px">
      <label class="row" style="gap:6px;font-size:13.5px;color:var(--muted)"><input type="checkbox" id="supt" ${S.sup?'checked':''}> Ընդգծել լրացումները (սլայդներում չկա)</label>
    </div>
    <div class="lec-tabs">${tabs}</div>
    ${body}
  </div>`;
}
function bindLectures(){
  document.querySelectorAll('[data-lec]').forEach(b => b.onclick = () => { curLec = +b.dataset.lec; lecQuery=''; render(); window.scrollTo(0,0); });
  document.querySelectorAll('[data-jump]').forEach(b => b.onclick = e => { e.preventDefault(); const [L,i] = b.dataset.jump.split(':'); curLec=+L; lecQuery=''; render(); const el = document.getElementById('s'+L+'-'+i); if (el) el.scrollIntoView({behavior:'smooth'}); });
  const q = $('#lecq'); if (q){ q.oninput = () => { lecQuery = q.value; const pos=q.selectionStart; render(); const n=$('#lecq'); n.focus(); n.setSelectionRange(pos,pos); }; }
  const st = $('#supt'); if (st) st.onchange = () => { S.sup = st.checked; save(); render(); };
  const mr = $('#markread'); if (mr) mr.onclick = () => { S.read[curLec] = !S.read[curLec]; save(); render(); };
  document.querySelectorAll('[data-qlec]').forEach(a => a.onclick = () => { qFilter = 'l'+a.dataset.qlec; });
  document.querySelectorAll('[data-zlec]').forEach(a => a.onclick = () => { quizCfg.lec = a.dataset.zlec; quiz = null; });
}

/* ---------- QUESTIONS ---------- */
let openQ = null, qFilter = 'all', shown = {};
function qMatches(q){
  if (qFilter==='all') return true;
  if (qFilter[0]==='l') return q.l === +qFilter.slice(1);
  if (qFilter==='weak') return rateOf(q.id) < 3;
  return true;
}
// Key points of a model answer = its <li> items; the student ticks the ones their written answer covered.
const points = q => [...q.a.matchAll(/<li>([\s\S]*?)<\/li>/g)].map(m => m[1]);
const chk = id => (S.chk[id] = S.chk[id] || []);
function checklist(q){
  const pts = points(q), c = chk(q.id), n = pts.filter((_,k)=>c[k]).length;
  return `<div class="checklist"><div class="row" style="justify-content:space-between"><b>Ստուգեք ձեր պատասխանը․ ի՞նչ եք գրել</b><span class="mono cl-score">${n}/${pts.length}</span></div>
    ${pts.map((p,k)=>`<label class="cl-item"><input type="checkbox" data-ck="${q.id}" data-k="${k}" ${c[k]?'checked':''}><span>${p}</span></label>`).join('')}</div>`;
}
function fullAnswer(q, open){
  const L = lecById(q.l);
  return `<details class="full" ${open?'open':''}><summary>Ամբողջական պատասխան (դասախոսության տեքստը և նկարները)</summary>
    <div class="full-in ${S.sup?'sup-on':''}">${q.sec.map(i => { const s = L.sections[i]; return `<section class="sec"><h3><span class="n">${L.id}.${i+1}</span>${s.h}</h3><div class="prose">${wrapTables(s.html)}</div>${s.figs?`<div class="figs">${s.figs.map(figHTML).join('')}</div>`:''}</section>`; }).join('')}</div></details>`;
}
function rateRow(q){
  const r = rateOf(q.id);
  return `<div class="rate"><span style="color:var(--muted)">Որքանո՞վ գիտեք</span>${[1,2,3].map(k=>`<button data-r="${k}" data-rq="${q.id}" aria-pressed="${r===k}">${RATE_T[k]}</button>`).join('')}</div>`;
}
function qCard(q){
  const open = openQ===q.id, r = rateOf(q.id), d = S.draft[q.id] || '';
  if (S.qmode==='study') return `<div class="q" id="q-${q.id}">
    <button class="q-head" data-tq="${q.id}" aria-expanded="${open}"><span class="q-id">${q.id}</span><span class="q-text">${esc(q.q)}</span><span class="badge r${r}">${RATE_T[r]}</span></button>
    ${open ? `<div class="q-body"><span class="eyebrow">Պատասխանի պլան</span><div class="answer prose">${q.a}</div>${fullAnswer(q,true)}
      <div class="row"><button class="btn small primary" data-tocheck="${q.id}">Սովորեցի → Ստուգել ինձ գրավոր</button></div>${rateRow(q)}</div>` : ''}
  </div>`;
  return `<div class="q" id="q-${q.id}">
    <button class="q-head" data-tq="${q.id}" aria-expanded="${open}"><span class="q-id">${q.id}</span><span class="q-text">${esc(q.q)}</span><span class="badge r${r}">${RATE_T[r]}</span></button>
    ${open ? `<div class="q-body">
      <label class="eyebrow" for="dr-${q.id}">1 · Գրեք պատասխանը առանց նայելու</label>
      <textarea id="dr-${q.id}" data-draft="${q.id}" placeholder="Սահմանում → բացատրություն → բանաձև կամ սխեմա → օրինակներ, թվեր…">${esc(d)}</textarea>
      <div class="row" style="justify-content:space-between;font-size:13px;color:var(--muted)"><span class="wc" data-wc="${q.id}">${wc(d)}</span><span>Սևագիրը պահվում է ավտոմատ</span></div>
      ${shown[q.id] ? `<span class="eyebrow">2 · Համեմատեք</span>${checklist(q)}${fullAnswer(q)}
        <span class="eyebrow">3 · Գնահատեք ձեզ</span>${rateRow(q)}`
      : `<div><button class="btn primary small" data-show="${q.id}">Ստուգել պատասխանը</button></div>`}
    </div>` : ''}
  </div>`;
}
const wc = t => { const n = (t.trim().match(/\S+/g)||[]).length; return n ? n+' բառ' : 'Դեռ ոչինչ գրված չէ'; };
function viewQuestions(){
  const F = [['all','Բոլորը'],['weak','Չսովորածները'],...D.lectures.map(l=>['l'+l.id,'Դաս. '+l.id])];
  const groups = THEMES.map(t => {
    const items = D.questions.filter(q => q.t===t && qMatches(q)); if (!items.length) return '';
    return `<section class="qgroup"><h2>Դաս. ${t}. ${TOPICS[t]}</h2>${items.map(q=>qCard(q)).join('')}</section>`;
  }).join('');
  return `<div class="view">

    <div class="modes" role="tablist">

function bindQuestions(){
  document.querySelectorAll('[data-qm]').forEach(b => b.onclick = () => { S.qmode = b.dataset.qm; save(); render(); });

// Shared by question cards and the exam: drafts save without re-rendering (keeps focus), checkboxes update the score in place.

/* ---------- FLASHCARDS ---------- */
let deck = null, deckLec = 'all', deckOnlyNew = false, flipped = false;
function makeDeck(){
  let idx = D.cards.map((c,i)=>i).filter(i => deckLec==='all' || D.cards[i][0]===+deckLec);
  if (deckOnlyNew) idx = idx.filter(i => !S.known[i]);
  deck = { order: shuffle(idx), pos: 0 }; flipped = false;
}
function viewCards(){
  if (!deck) makeDeck();
  const total = deck.order.length, i = deck.order[deck.pos], c = D.cards[i];
  const sel = `<select id="dlec"><option value="all">Բոլոր դասախոսությունները</option>${D.lectures.map(l=>`<option value="${l.id}" ${deckLec==l.id?'selected':''}>Դասախոսություն ${l.id}</option>`).join('')}</select>`;
  const known = D.cards.filter((c,k)=>S.known[k] && (deckLec==='all'||c[0]===+deckLec)).length;
  const scope = D.cards.filter(c=>deckLec==='all'||c[0]===+deckLec).length;
  return `<div class="view">
    <header class="view-head"><span class="eyebrow">${scope} քարտ · սովորած ${known}</span><h1>Քարտեր</h1>
    <p class="lede">Տերմին → սահմանում։ Սեղմեք քարտին կամ Space՝ շրջելու համար, ← «Կրկնել», → «Գիտեմ»։</p></header>
    <div class="row">${sel}<label class="row" style="gap:6px;font-size:14px"><input type="checkbox" id="donly" ${deckOnlyNew?'checked':''}> Միայն չսովորածները</label><button class="btn small" id="dshuf">Խառնել</button></div>
    ${total ? `<div class="deck">
      <div class="progress"><i style="width:${100*deck.pos/total}%"></i></div>
      <button class="card ${flipped?'flipped':''}" id="card" aria-label="Շրջել քարտը"><div class="card-in">
        <div class="face"><small>ԴԱՍ. ${c[0]} · ${deck.pos+1}/${total}</small><div class="term">${esc(c[1])}</div><span class="hint">Սեղմեք՝ շրջելու համար</span></div>
        <div class="face back"><small>${S.known[i]?'✓ ՍՈՎՈՐԱԾ':'ՍԱՀՄԱՆՈՒՄ'}</small><div class="def">${esc(c[2])}</div></div>
      </div></button>
      <div class="deck-ctrl"><button class="btn" id="dprev" ${deck.pos?'':'disabled'}>← Նախորդ</button><button class="btn" id="dagain">Կրկնել</button><button class="btn primary" id="dknow">Գիտեմ</button></div>
    </div>` : `<div class="panel">Այս խմբում բոլոր քարտերը սովորած են։ Հանեք «Միայն չսովորածները» նշումը՝ կրկնելու համար։</div>`}
  </div>`;
}
function cardNext(knew){
  const i = deck.order[deck.pos];
  if (knew) S.known[i] = true; else { delete S.known[i]; deck.order.push(i); }
  save(); deck.pos++; flipped = false;
  if (deck.pos >= deck.order.length){ makeDeck(); }
  render();
}
function bindCards(){
  $('#dlec').onchange = e => { deckLec = e.target.value; makeDeck(); render(); };
  $('#donly').onchange = e => { deckOnlyNew = e.target.checked; makeDeck(); render(); };
  $('#dshuf').onclick = () => { makeDeck(); render(); };
  const card = $('#card'); if (!card) return;
  card.onclick = () => { flipped = !flipped; card.classList.toggle('flipped', flipped); };
  $('#dknow').onclick = () => cardNext(true);
  $('#dagain').onclick = () => cardNext(false);
  $('#dprev').onclick = () => { deck.pos = Math.max(0,deck.pos-1); flipped=false; render(); };
}
document.addEventListener('keydown', e => {
  if (route !== 'cards' || !$('#card') || e.target.matches('input,select,textarea')) return;
  if (e.key===' '){ e.preventDefault(); $('#card').click(); }
  if (e.key==='ArrowRight') cardNext(true);
  if (e.key==='ArrowLeft') cardNext(false);
});

/* ---------- QUIZ ---------- */
let quiz = null; const quizCfg = { lec:'all', n:15 };
function startQuiz(){
  let pool = D.quiz.map((q,i)=>i).filter(i => quizCfg.lec==='all' || D.quiz[i][0]===+quizCfg.lec);
  pool = shuffle(pool).slice(0, quizCfg.n==='all' ? pool.length : +quizCfg.n);
  quiz = { items: pool.map(i => ({ i, opts: shuffle(D.quiz[i][2].map((t,k)=>({t,ok:k===0}))), pick:null })), pos:0, done:false };
}
function viewQuiz(){
  const head = `<header class="view-head"><span class="eyebrow">${D.quiz.length} հարց բանկում</span><h1>Թեստ</h1></header>`;
  if (!quiz){
    const hist = S.quiz.slice(-10);
    return `<div class="view">${head}
      <div class="panel" style="display:flex;flex-direction:column;gap:16px">
        <div class="row"><label for="zlec" style="min-width:110px">Դասախոսություն</label><select id="zlec"><option value="all">Բոլորը (1–${D.lectures.length})</option>${D.lectures.map(l=>`<option value="${l.id}" ${quizCfg.lec==l.id?'selected':''}>${l.id}. ${l.title}</option>`).join('')}</select></div>
        <div class="row"><label for="zn" style="min-width:110px">Հարցերի թիվ</label><select id="zn">${[10,15,25,'all'].map(n=>`<option value="${n}" ${quizCfg.n==n?'selected':''}>${n==='all'?'Բոլորը':n}</option>`).join('')}</select></div>
        <div><button class="btn primary" id="zstart">Սկսել թեստը</button></div>
      </div>
      ${hist.length ? `<section class="panel"><h2 style="font-size:17px;margin-bottom:10px">Վերջին արդյունքները</h2><div class="row" style="align-items:flex-end;gap:16px"><div class="hist">${hist.map(r=>`<i style="height:${Math.max(4,60*r.s/r.n)}px" title="${r.s}/${r.n} · ${r.l==='all'?'բոլորը':'դաս. '+r.l}"></i>`).join('')}</div><span class="note">${hist.map(r=>Math.round(100*r.s/r.n)+'%').join(' · ')}</span></div></section>`:''}
    </div>`;
  }
  if (quiz.done){
    const s = quiz.items.filter(x=>x.pick!==null && x.opts[x.pick].ok).length, n = quiz.items.length;
    const wrong = quiz.items.filter(x=>!x.opts[x.pick].ok);
    return `<div class="view">${head}
      <div class="panel row" style="gap:24px"><span class="score">${Math.round(100*s/n)}%</span><div><b>${s} ճիշտ ${n}-ից</b><br><span class="note">${s===n?'Կատարյալ է։':wrong.length+' սխալ․ դրանք ներքևում են՝ ճիշտ պատասխաններով։'}</span></div></div>
      ${wrong.length?`<section class="mist"><h2 style="font-size:18px">Սխալներ</h2>${wrong.map(x=>{const Q=D.quiz[x.i];return `<div><b>${esc(Q[1])}</b><br>Ձեր պատասխանը՝ ${esc(x.opts[x.pick].t)}<br>Ճիշտ է՝ <b>${esc(Q[2][0])}</b><br><span class="note">${esc(Q[3])} (Դաս. ${Q[0]})</span></div>`;}).join('')}</section>`:''}
      <div class="row"><button class="btn primary" id="zagain">Նոր թեստ</button><button class="btn" id="zsetup">Փոխել կարգավորումները</button></div></div>`;
  }
  const it = quiz.items[quiz.pos], Q = D.quiz[it.i], ans = it.pick!==null;
  return `<div class="view">${head}
    <div class="qz-top"><span>Հարց ${quiz.pos+1} / ${quiz.items.length} · Դաս. ${Q[0]}</span><span>${quiz.items.filter(x=>x.pick!==null&&x.opts[x.pick].ok).length} ճիշտ</span></div>
    <div class="progress" style="max-width:none"><i style="width:${100*quiz.pos/quiz.items.length}%"></i></div>
    <p class="qz-q">${esc(Q[1])}</p>
    <div class="qz-opts">${it.opts.map((o,k)=>`<button class="opt ${ans&&o.ok?'ok':''} ${ans&&it.pick===k&&!o.ok?'no':''}" data-pick="${k}" ${ans?'disabled':''}><span class="k">${'ԱԲԳԴ'[k]}</span><span>${esc(o.t)}</span></button>`).join('')}</div>
    ${ans?`<div class="explain"><b>${it.opts[it.pick].ok?'Ճիշտ է։':'Սխալ է։'}</b> ${esc(Q[3])}</div><div><button class="btn primary" id="znext">${quiz.pos+1<quiz.items.length?'Հաջորդը →':'Տեսնել արդյունքը'}</button></div>`:''}
  </div>`;
}
function bindQuiz(){
  if ($('#zstart')){ $('#zlec').onchange=e=>quizCfg.lec=e.target.value; $('#zn').onchange=e=>quizCfg.n=e.target.value; $('#zstart').onclick=()=>{startQuiz();render();}; }
  document.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => { quiz.items[quiz.pos].pick = +b.dataset.pick; render(); });
  const nx = $('#znext'); if (nx) nx.onclick = () => {
    if (quiz.pos+1 < quiz.items.length){ quiz.pos++; } else {
      quiz.done = true; const s = quiz.items.filter(x=>x.opts[x.pick].ok).length;
      S.quiz.push({s, n:quiz.items.length, l:quizCfg.lec, t:Date.now()}); S.quiz = S.quiz.slice(-30); save();
    } render(); window.scrollTo(0,0); };
  if ($('#zagain')){ $('#zagain').onclick=()=>{startQuiz();render();}; $('#zsetup').onclick=()=>{quiz=null;render();}; }
}
document.addEventListener('keydown', e => {
  if (route!=='quiz' || !quiz || quiz.done || e.target.matches('input,select,textarea')) return;
  const k = ['1','2','3','4'].indexOf(e.key); const it = quiz.items[quiz.pos];
  if (k>=0 && it.pick===null && k<it.opts.length){ it.pick=k; render(); }
  else if (e.key==='Enter' && it.pick!==null) $('#znext')?.click();
});

/* ---------- EXAM ---------- */
let exam = null, tick = null;
function startExam(mins){
  const themes = shuffle(THEMES).slice(0,3).sort();
  exam = { qs: themes.map(t => shuffle(D.questions.filter(q=>q.t===t))[0].id), end: mins ? Date.now()+mins*60000 : null, done:false, txt:{} };
}
const fmt = ms => { const s=Math.max(0,Math.round(ms/1000)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); };
function viewExam(){
  const head = `<header class="view-head"><span class="eyebrow">Տոմս՝ 3 հարց, մեկական յուրաքանչյուր դասախոսությունից</span><h1>Քննության փորձ</h1>`;
  if (!exam) return `<div class="view">${head}<p class="lede">Ինչպես իսկական քննությունում․ 3 պատահական հարց՝ մեկական յուրաքանչյուր դասախոսությունից, ժամաչափով։ Գրեք պատասխանները առանց նյութին նայելու։ Ավարտելուց հետո ստուգեք յուրաքանչյուրը հիմնական կետերի ցանկով, կարդացեք ամբողջական պատասխանը և գնահատեք ձեզ։ Գնահատականը կերևա «Գրավոր հարցեր» բաժնում։</p></header>
    <div class="panel row"><span>Ժամանակ՝</span><button class="btn primary" data-ex="45">45 րոպե</button><button class="btn" data-ex="30">30 րոպե</button><button class="btn" data-ex="0">Առանց ժամաչափի</button></div></div>`;
  const qs = exam.qs.map(id => D.questions.find(q=>q.id===id));
  return `<div class="view">${head}</header>
    <div class="row" style="justify-content:space-between">${exam.end&&!exam.done?`<span class="timer" id="timer">${fmt(exam.end-Date.now())}</span>`:'<span></span>'}
      ${exam.done?`<button class="btn" id="exnew">Նոր տոմս</button>`:`<button class="btn primary" id="exend">Ավարտել և ստուգել</button>`}</div>
    ${qs.map((q,k)=>`<div class="ticket"><span class="q-id">Հարց ${k+1} · ${q.id} · Դաս. ${q.t}</span><h3>${esc(q.q)}</h3>
      ${exam.done ? `${exam.txt[q.id]?`<div class="panel" style="white-space:pre-wrap;font-size:14.5px"><span class="eyebrow">Ձեր պատասխանը</span><br>${esc(exam.txt[q.id])}</div>`:''}
        ${checklist(q)}${fullAnswer(q)}${rateRow(q)}`
      : `<textarea id="ex-${k}" data-ext="${q.id}" placeholder="Գրեք պատասխանը այստեղ․ սահմանում, բացատրություն, բանաձև/սխեմա, թվեր…">${esc(exam.txt[q.id]||'')}</textarea>`}</div>`).join('')}
  </div>`;
}
function bindExam(){
  clearInterval(tick);
  document.querySelectorAll('[data-ex]').forEach(b => b.onclick = () => { startExam(+b.dataset.ex); render(); });
  document.querySelectorAll('[data-ext]').forEach(t => t.oninput = () => exam.txt[t.dataset.ext] = t.value);
  const fin = () => { exam.done = true; clearInterval(tick); render(); window.scrollTo(0,0); };
  if ($('#exend')) $('#exend').onclick = fin;
  if ($('#exnew')) $('#exnew').onclick = () => { exam = null; render(); };
  document.querySelectorAll('.ticket [data-rq]').forEach(b => b.onclick = () => { S.rate[b.dataset.rq] = +b.dataset.r; save(); render(); });
  bindWriting();
  if (exam && exam.end && !exam.done){
    tick = setInterval(() => { const el = $('#timer'); if (!el) return clearInterval(tick); const left = exam.end-Date.now(); el.textContent = fmt(left); el.classList.toggle('low', left<5*60000); if (left<=0) fin(); }, 1000);
  }
}

/* ---------- ORBITS / ALTITUDE EXPLORER ---------- */
const H0=0.1, H1=50000, OX0=70, OX1=750, OY0=24, OY1=540;
const LH0=Math.log10(H0), LH1=Math.log10(H1);
const Yh = h => OY1 - (OY1-OY0)*(Math.log10(Math.max(h,H0))-LH0)/(LH1-LH0);
const hY = y => Math.pow(10, LH0 + (OY1-y)/(OY1-OY0)*(LH1-LH0));
const fmtH = h => h<1 ? Math.round(h*1000)+' մ' : (h<10 ? h.toFixed(1).replace('.',',') : Math.round(h).toLocaleString('hy-AM').replace(/,/g,' '))+' կմ';

 ['Մեզոսֆերա',50,85,'Ցուրտ՝ մինչև −90 °C։ Այրվում են երկնաքարերը։'],
 ['Թերմոսֆերա',85,700,'Մինչև 1500 °C, շատ ցածր խտություն։ ISS, բևեռափայլ, իոնոսֆերա։ Վերին սահմանը 500–1000 կմ։'],
 ['Էկզոսֆերա',700,10000,'Օդը չափազանց նոսր է․ ջրածին և հելիում։ Սկսվում է 700–1000 կմ-ից։'],
 ['Արտաքին տիեզերք',10000,H1,'Մթնոլորտը գործնականում չկա։ MEO, GEO։']
];
// [id, name, from, to, column x, note]
const ORBS = [
 ['leo','LEO',160,1500,'Երկրի ցածր ուղեծիր․ 90–120 ր պարբերություն, օրական մինչև 16 պտույտ։ Հեռազննում, Երկրի դիտարկում, Iridium, Globalstar, Orbcomm։'],
 ['sso','SSO',600,800,'Արեգակնային համաժամանակյա․ բևեռներով, նույն տեղական ժամին։ Երկրի դիտարկում։'],
 ['meo','MEO',5000,20000,'Միջին ուղեծիր․ նավիգացիա՝ GPS, GLONASS, Galileo։'],
 ['geo','GEO',35500,36100,'Գեոստացիոնար 35 786 կմ․ հասարակածի վերևում, 3 արբանյակ՝ գրեթե գլոբալ ծածկույթ։ Կապ, եղանակ։'],
 ['gto','GTO',200,35786,'Փոխանցման ուղեծիր դեպի GEO (էլիպս՝ ցածր պերիգեյից մինչև GEO բարձրություն)։'],
 ['heo','HEO',1000,40000,'Խիստ էլիպսաձև ուղեծիր, ապոգեյը ≈ 40 000 կմ։']
];
// [name, from, to, kind] kind: 'obj' or 'haz'
const MARKS = [
 ['Դրոն (UAV)',0.15,0.15,'obj'],['Օդային TV',0.3,0.3,'obj'],['Օդային լուսանկարում',1.2,3.5,'obj'],['Օդային SAR',10,12,'obj'],
 ['Space Shuttle',185,575,'obj'],['ISS',400,420,'obj'],['Օպտիկական/SAR արբանյակ',700,900,'obj'],['GNSS (GPS)',20200,20200,'obj'],['GEO արբանյակներ',35786,35786,'obj'],
 ['SAA',200,800,'haz'],['Վան Ալլեն (ներքին)',1000,13000,'haz'],['Քարմանի գիծ',100,100,'haz'],['Օզոնային շերտ',15,35,'haz']
];
const MU = 398600.4418, RE = 6371;
let orbH = 400;
const COLX = {layer:[OX0,250], orb:[262,470], obj:[482,620], haz:[620,OX1]};
function viewOrbits(){
  const band = (x0,x1,a,b,cls,extra='') => `<rect class="${cls}" x="${x0}" width="${x1-x0}" y="${Yh(b)}" height="${Math.max(2,Yh(a)-Yh(b))}" ${extra}/>`;
  const yt = [0.1,0.3,1,3,10,30,100,300,1000,3000,10000,35786];
  const orbX = {leo:[268,330],sso:[336,362],meo:[268,330],geo:[268,470],gto:[372,392],heo:[400,420]};
  const svg = `<svg class="dg ob" id="ob" viewBox="0 0 770 570" role="img" aria-label="Բարձրություններ, մթնոլորտի շերտեր և ուղեծրեր">
    ${yt.map(h=>`<line class="grid" x1="${OX0}" x2="${OX1}" y1="${Yh(h)}" y2="${Yh(h)}"/><text class="axis" x="${OX0-8}" y="${Yh(h)+4}" text-anchor="end">${h<1?h*1000+' մ':h.toLocaleString('en').replace(/,/g,' ')}</text>`).join('')}
    <text class="axis" x="${OX0-8}" y="${OY0-10}" text-anchor="end">h, կմ</text>
    <text class="colh" x="${(COLX.layer[0]+COLX.layer[1])/2}" y="${OY1+22}" text-anchor="middle">Մթնոլորտ</text>
    <text class="colh" x="366" y="${OY1+22}" text-anchor="middle">Ուղեծրեր</text>
    <text class="colh" x="551" y="${OY1+22}" text-anchor="middle">Սարքեր</text>
    <text class="colh" x="685" y="${OY1+22}" text-anchor="middle">Վտանգներ</text>
    ${LAYERS.map((l,i)=>band(COLX.layer[0],COLX.layer[1],Math.max(l[1],H0),l[2],'lay l'+i,`data-lay="${i}"`)).join('')}
    ${LAYERS.map((l,i)=>{const a=Yh(Math.max(l[1],H0)),b=Yh(l[2]);return a-b>16?`<text class="lbl" x="${(COLX.layer[0]+COLX.layer[1])/2}" y="${(a+b)/2+4}" text-anchor="middle">${l[0]}</text>`:'';}).join('')}
    ${ORBS.map(o=>{const [x0,x1]=orbX[o[0]];return band(x0,x1,o[2],o[3],'orb o-'+o[0])+`<text class="olbl" x="${o[0]==='geo'?x1-4:(x0+x1)/2}" y="${o[0]==='geo'?Yh(o[3])-4:(o[0]==='sso'?Yh(o[3])-4:(Yh(o[2])+Yh(o[3]))/2+4)}" text-anchor="${o[0]==='geo'?'end':'middle'}">${o[1]}</text>`;}).join('')}
    ${MARKS.map(m=>{const x=m[3]==='obj'?COLX.obj[0]+6:COLX.haz[0]+6, y0=Yh(m[1]), y1=Yh(m[2]);
      const ly = {'ISS':-9,'Space Shuttle':4,'Օպտիկական/SAR արբանյակ':-14,'SAA':10,'Քարմանի գիծ':0}[m[0]]||0;
      return (m[1]===m[2] ? `<circle class="mk2 ${m[3]}" cx="${x+3}" cy="${y0}" r="3.5"/>` : `<rect class="mkb ${m[3]}" x="${x}" width="6" y="${y1}" height="${Math.max(3,y0-y1)}"/>`)+`<text class="mlbl" x="${x+12}" y="${(y0+y1)/2+4+ly}">${m[0]}</text>`;}).join('')}
    <line class="karman" x1="${OX0}" x2="${OX1}" y1="${Yh(100)}" y2="${Yh(100)}"/>
    <g><line class="mkl" id="obl" x1="${OX0}" x2="${OX1}"/><circle class="mk" id="obc" cx="${OX0}" r="6"/></g>
  </svg>`;
  const presets = [['Քարմանի գիծ',100],['ISS',400],['SSO',700],['Վան Ալլեն',3000],['GPS',20200],['GEO',35786]];
  return `<div class="view">
    <header class="view-head"><span class="eyebrow">Դասախոսություն 2 · մթնոլորտ և ուղեծրեր</span><h1>Ուղեծրեր և բարձրություններ</h1>
    <p class="lede">Սեղմեք սանդղակի ցանկացած կետին կամ շարժեք սահիչը․ կտեսնեք մթնոլորտի շերտը, ուղեծրի տեսակը, սարքերն ու վտանգները այդ բարձրության վրա, ինչպես նաև շրջանային ուղեծրի արագությունն ու պարբերությունը։ Սանդղակը լոգարիթմական է։</p></header>
    <div class="dg-wrap">${svg}</div>
    <div class="dg-ctrl" style="grid-template-columns:minmax(0,1fr)">
      <label for="obh">Բարձրություն՝ <b class="mono" id="obhv"></b><input type="range" id="obh" min="${LH0}" max="${LH1}" step="0.001" value="${Math.log10(orbH)}"></label>
      <div class="row">${presets.map(([t,h])=>`<button class="btn small" data-oh="${h}">${t}</button>`).join('')}</div>
    </div>
    <div class="panel dg-info" id="obinfo"></div>
    <section class="panel prose" style="max-width:none"><h2 style="font-size:18px;margin-bottom:8px">Ուղեծրերի ամփոփում</h2>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Ուղեծիր</th><th>Բարձրություն</th><th>Պարբերություն</th><th>Կիրառում</th></tr></thead><tbody>
      <tr><td><b>LEO</b></td><td class="mono">160–1500 կմ</td><td class="mono">90–120 ր</td><td>Հեռազննում, Երկրի դիտարկում, mesh ցանցեր</td></tr>
      <tr><td><b>SSO</b></td><td class="mono">600–800 կմ</td><td class="mono">≈ 97–101 ր</td><td>Երկրի դիտարկում նույն լուսավորությամբ</td></tr>
      <tr><td><b>MEO</b></td><td class="mono">5000–20 000 կմ</td><td class="mono">≈ 3–12 ժ</td><td>Նավիգացիա՝ GPS, GLONASS, Galileo</td></tr>
      <tr><td><b>GEO</b></td><td class="mono">35 786 կմ</td><td class="mono">23 ժ 56 ր</td><td>Կապ, եղանակ․ 3 արբանյակ՝ գլոբալ ծածկույթ</td></tr>
      <tr><td><b>GTO</b></td><td class="mono">մինչև 35 786 կմ</td><td class="mono">≈ 10.5 ժ</td><td>Փոխանցում դեպի GEO</td></tr></tbody></table></div>
      <p class="note">Պարբերությունները հաշվարկված են T = 2π·√(r³/μ) բանաձևով (լրացում, դասախոսությունում տրված է միայն LEO-ինը)։</p></section>
  </div>`;
}
function obUpdate(){
  const h = orbH, y = Yh(h);
  $('#obhv').textContent = fmtH(h);
  $('#obc').setAttribute('cy',y); ['y1','y2'].forEach(k=>$('#obl').setAttribute(k,y));
  const li = LAYERS.findIndex(l => h>=l[1] && h<l[2]), L = LAYERS[li];
  document.querySelectorAll('.lay').forEach(r => r.classList.toggle('on', +r.dataset.lay===li));
  const near = (a,b) => h >= a/1.08 && h <= b*1.08;
  const os = ORBS.filter(o => near(o[2],o[3]));
  const ms = MARKS.filter(m => near(m[1],m[2]));
  const r = RE + h, v = Math.sqrt(MU/r), T = 2*Math.PI*Math.sqrt(r*r*r/MU)/60;
  const Tt = T<120 ? T.toFixed(1).replace('.',',')+' ր' : Math.floor(T/60)+' ժ '+Math.round(T%60)+' ր';
  const orbitOk = h >= 100;
  let warn = '';
  if (h < 100) warn = 'Քարմանի գծից ցածր է՝ սա դեռ օդային տարածք է (Airborne)։ Ուղեծրային թռիչք հնարավոր չէ։';
  else if (h < 160) warn = 'Մթնոլորտը դեռ խիտ է․ ուղեծիրը կքայքայվի մի քանի ժամում կամ օրում։';
  else if (h < 600) warn = '600 կմ-ից ցածր արբանյակները հակված են անկման՝ մթնոլորտային դիմադրության պատճառով։';
  $('#obinfo').innerHTML = `<div><span class="eyebrow">Շերտ</span><h3>${L[0]}</h3><p style="margin:6px 0 0">${L[3]}</p>
      ${os.length?`<p style="margin:10px 0 0">${os.map(o=>`<b>${o[1]}</b>՝ ${o[4]}`).join('<br>')}</p>`:''}
      ${warn?`<p class="note" style="margin:10px 0 0">${warn}</p>`:''}</div>
    <dl class="kv"><dt>Բարձրություն</dt><dd class="mono">${fmtH(h)}</dd>
      <dt>Ուղեծիր</dt><dd>${os.length?os.map(o=>o[1]).join(', '):'—'}</dd>
      <dt>Այստեղ</dt><dd>${ms.length?ms.map(m=>m[0]).join(', '):'—'}</dd>
      ${orbitOk?`<dt>Արագություն</dt><dd class="mono">${v.toFixed(2).replace('.',',')} կմ/վ</dd><dt>Պարբերություն</dt><dd class="mono">${Tt}</dd><dt>Պտույտ/օր</dt><dd class="mono">${(1440/T).toFixed(1).replace('.',',')}</dd>`:''}</dl>`;
}
function bindOrbits(){
  const svg = $('#ob'), s = $('#obh');
  svg.addEventListener('click', e => {
    const pt = svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY; const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    if (p.y<OY0||p.y>OY1) return;
    orbH = hY(p.y); s.value = Math.log10(orbH); obUpdate();
  });
  s.oninput = () => { orbH = Math.pow(10, +s.value); obUpdate(); };
  document.querySelectorAll('[data-oh]').forEach(b => b.onclick = () => { orbH = +b.dataset.oh; s.value = Math.log10(orbH); obUpdate(); });
  obUpdate();
}

/* ---------- router ---------- */
let route = 'home';
const V = { home:[viewHome,()=>{}], lectures:[viewLectures,bindLectures], questions:[viewQuestions,bindQuestions], cards:[viewCards,bindCards], quiz:[viewQuiz,bindQuiz], exam:[viewExam,bindExam], orbits:[viewOrbits,bindOrbits] };
function render(){ buildNav(route); $('#main').innerHTML = V[route][0](); V[route][1](); }
function onHash(){
  const h = location.hash.slice(1);
  const prev = route; route = V[h] ? h : 'home';
  if (prev==='exam' && route!=='exam') clearInterval(tick);
  render(); if (prev!==route) window.scrollTo(0,0);
}
window.addEventListener('hashchange', onHash);
$('#reset').onclick = e => {
  const b = e.target;
  if (b.dataset.armed){ S = { read:{}, rate:{}, known:{}, quiz:[], sup:true, draft:{}, chk:{} }; save(); deck=null; quiz=null; exam=null; b.textContent='Զրոյացված է'; delete b.dataset.armed; render(); }
  else { b.dataset.armed='1'; b.textContent='Սեղմեք կրկին՝ հաստատելու համար'; setTimeout(()=>{ if(b.dataset.armed){delete b.dataset.armed; b.textContent='Զրոյացնել առաջընթացը';} },4000); }
};
onHash();
})();
</script>
